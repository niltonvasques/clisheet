[package]
name = "clisheet"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Planilhas XLSX no terminal"
license = "MIT"

[dependencies]
ironcalc = "=0.9.1"
ratatui = "=0.29.0"
crossterm = { version = "=0.28.1", features = ["bracketed-paste"] }
unicode-width = "=0.2.0"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.38"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
signal-hook = "0.3"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[patch.crates-io]
ironcalc_base = { path = "vendor/ironcalc_base" }
